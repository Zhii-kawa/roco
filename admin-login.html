<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:#f1f5f9;display:flex;align-items:center;justify-content:center;height:100vh}
.login-card{background:white;padding:32px;border-radius:12px;box-shadow:0 2px 8px #0002;width:100%;max-width:400px}
h2{text-align:center;margin-bottom:24px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px}
.btn{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:8px;font-size:16px}
.tip{text-align:center;margin-top:16px;color:#64748b;font-size:14px}
</style>
</head>
<body>
<div class="login-card">
  <h2>管理员登录</h2>
  <input type="text" id="adminUser" placeholder="用户名">
  <input type="password" id="adminPwd" placeholder="密码">
  <button class="btn" onclick="adminLogin()">登录</button>
  <p class="tip">仅管理员可进入</p>
</div>

<script>
function adminLogin(){
  let user=document.getElementById("adminUser").value;
  let pwd=document.getElementById("adminPwd").value;
  // 你可以自己改账号密码
  if(user==="admin"&&pwd==="admin123"){
    // 实际订单查看在FormBold后台，这里仅跳转提示
    alert("登录成功！请前往FormBold后台查看订单");
    window.open("https://formbold.com/dashboard","_blank");
  }else{
    alert("用户名或密码错误");
  }
}
</script>
</body>
</html>
