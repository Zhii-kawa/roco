<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="common.css"> <!-- 引入公共样式 -->
  <style>
    /* 登录页专属样式 */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      background: var(--white);
      padding: 2rem;
      border-radius: 0.75rem;
      box-shadow: var(--shadow-hover);
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--primary);
    }
    .tip {
      text-align: center;
      margin-top: 1rem;
      color: var(--gray);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>管理员登录</h2>
      <input type="text" id="adminUser" placeholder="用户名" required>
      <input type="password" id="adminPwd" placeholder="密码" required>
      <button class="btn" onclick="adminLogin()" style="margin-top: 1.5rem;">登录</button>
      <p class="tip">仅管理员可进入，订单数据仅用于内部管理</p>
    </div>
  </div>

  <script>
    function adminLogin() {
      const user = document.getElementById("adminUser").value;
      const pwd = document.getElementById("adminPwd").value;

      // 需修改：替换为自己的管理员账号密码（建议复杂密码，不要用默认）
      const ADMIN_USER = "admin";
      const ADMIN_PWD = "admin123";
      const FORMBOLD_URL = "https://formbold.com/dashboard"; // 需确认FormBold后台地址

      if (user === ADMIN_USER && pwd === ADMIN_PWD) {
        alert("登录成功！即将跳转到订单后台");
        window.open(FORMBOLD_URL, "_blank");
      } else {
        alert("用户名或密码错误，请重试");
        document.getElementById("adminPwd").value = ""; // 清空密码框
      }
    }
  </script>
</body>
</html>
