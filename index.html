<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织音俱乐部</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #f5f7fa;
}
/* 主容器：PC端居中，手机端全屏 */
.container {
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  background-color: #fff;
  min-height: 100vh;
  padding-bottom: 80px; /* 给底部导航留空间 */
}
/* 顶部标题 */
.header {
  padding: 24px 20px;
}
.header h1 {
  font-size: 28px;
  color: #4299e1; /* 和截图一致的蓝色 */
  font-weight: 600;
}
/* 功能按钮区：分类 + 点单 */
.btn-group {
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
  margin: 20px 0;
  gap: 16px;
}
.btn-card {
  flex: 1;
  background-color: #ccc; /* 截图里的灰色按钮 */
  border-radius: 16px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #fff;
  font-weight: 500;
}
/* 蓝色装饰块 */
.decoration {
  background-color: #4299e1;
  width: 80%;
  height: 60px;
  margin: 20px auto;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
}
/* 热门推荐标题 */
.section-title {
  text-align: center;
  color: #666;
  font-size: 20px;
  margin: 30px 0;
  position: relative;
}
.section-title::before,
.section-title::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 80px;
  height: 1px;
  background-color: #ccc;
}
.section-title::before { left: calc(50% - 100px); }
.section-title::after  { right: calc(50% - 100px); }
/* 推荐卡片 */
.recommend-list {
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.recommend-card {
  border: 2px solid #e0f2fe;
  border-radius: 16px;
  height: 300px;
  background-color: #fff;
}
.recommend-card.small {
  height: 80px;
}
/* 右下角悬浮按钮 */
.float-btn {
  position: fixed;
  right: 20px;
  bottom: 100px;
  width: 60px;
  height: 60px;
  background-color: #4299e1;
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
}
/* 底部导航栏 */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 750px;
  display: flex;
  background-color: #fff;
  border-top: 1px solid #eee;
}
.tab-item {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  font-size: 14px;
  color: #666;
}
.tab-item.active {
  color: #4299e1;
}
.tab-item .icon {
  font-size: 24px;
  display: block;
  margin-bottom: 4px;
}
/* PC端适配：让内容更居中 */
@media (min-width: 750px) {
  .btn-card:hover {
    background-color: #bbb;
    cursor: pointer;
  }
  .float-btn:hover {
    background-color: #3182ce;
  }
}
</style>
</head>
<body>
<div class="container">
  <!-- 顶部标题 -->
  <div class="header">
    <h1>织音俱乐部</h1>
  </div>

  <!-- 分类 + 点单按钮 -->
  <div class="btn-group">
    <div class="btn-card" onclick="location.href='service.html'">分类</div>
    <div class="btn-card" onclick="location.href='order.html'">点单</div>
  </div>

  <!-- 蓝色装饰块 -->
  <div class="decoration"></div>

  <!-- 热门推荐 -->
  <div class="section-title">热门推荐</div>
  <div class="recommend-list">
    <div class="recommend-card"></div>
    <div class="recommend-card small"></div>
  </div>

  <!-- 右下角悬浮按钮 -->
  <button class="float-btn">💬</button>
</div>

<!-- 底部导航栏 -->
<div class="tabbar">
  <div class="tab-item active">
    <span class="icon">🏠</span>
    首页
  </div>
  <div class="tab-item" onclick="location.href='service.html'">
    <span class="icon">▦</span>
    分类
  </div>
  <div class="tab-item">
    <span class="icon">👤</span>
    关于我们
  </div>
</div>
</body>
</html>
