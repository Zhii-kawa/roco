<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>立即点单</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #f5f7fa;
}
.container {
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  background-color: #fff;
  min-height: 100vh;
  padding: 24px 20px 80px;
}
.header h1 {
  font-size: 28px;
  color: #4299e1;
  margin-bottom: 20px;
}
/* 表单样式 */
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 16px;
  color: #333;
  margin-bottom: 8px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
}
.submit-btn {
  width: 100%;
  padding: 16px;
  background-color: #4299e1;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.back-btn {
  margin-top: 20px;
  text-align: center;
}
.back-btn a {
  color: #4299e1;
  text-decoration: none;
}
/* 底部导航栏 */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 750px;
  display: flex;
  background-color: #fff;
  border-top: 1px solid #eee;
}
.tab-item {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  font-size: 14px;
  color: #666;
}
.tab-item .icon {
  font-size: 24px;
  display: block;
  margin-bottom: 4px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>立即点单</h1>
  </div>

  <form action="https://formbold.com/s/你的表单地址" method="POST">
    <div class="form-group">
      <label>你的昵称</label>
      <input type="text" name="nickname" required>
    </div>
    <div class="form-group">
      <label>联系QQ</label>
      <input type="text" name="qq" required>
    </div>
    <div class="form-group">
      <label>选择服务</label>
      <select name="service" required>
        <option value="">请选择</option>
        <option value="play">陪玩服务</option>
        <option value="voice">语音点单</option>
      </select>
    </div>
    <div class="form-group">
      <label>备注说明</label>
      <textarea name="note" rows="3"></textarea>
    </div>
    <button class="submit-btn" type="submit">提交订单</button>
  </form>

  <div class="back-btn">
    <a href="index.html">← 返回首页</a>
  </div>
</div>

<div class="tabbar">
  <div class="tab-item" onclick="location.href='index.html'">
    <span class="icon">🏠</span>
    首页
  </div>
  <div class="tab-item" onclick="location.href='service.html'">
    <span class="icon">▦</span>
    分类
  </div>
  <div class="tab-item">
    <span class="icon">👤</span>
    关于我们
  </div>
</div>
</body>
</html>
