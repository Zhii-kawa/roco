<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务分类</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: #f5f7fa;
}
.container {
  width: 100%;
  max-width: 750px;
  margin: 0 auto;
  background-color: #fff;
  min-height: 100vh;
  padding: 24px 20px 80px;
}
.header h1 {
  font-size: 28px;
  color: #4299e1;
  margin-bottom: 20px;
}
/* 服务列表 */
.service-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
}
.service-card {
  background-color: #f5f7fa;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}
.service-card h3 {
  font-size: 16px;
  color: #333;
  margin-top: 10px;
}
/* 返回按钮 */
.back-btn {
  margin-top: 30px;
  text-align: center;
}
.back-btn a {
  color: #4299e1;
  text-decoration: none;
}
/* 底部导航栏 */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 750px;
  display: flex;
  background-color: #fff;
  border-top: 1px solid #eee;
}
.tab-item {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  font-size: 14px;
  color: #666;
}
.tab-item .icon {
  font-size: 24px;
  display: block;
  margin-bottom: 4px;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>服务分类</h1>
  </div>

  <div class="service-grid">
    <div class="service-card">
      <div class="icon">🎮</div>
      <h3>陪玩服务</h3>
    </div>
    <div class="service-card">
      <div class="icon">🎤</div>
      <h3>语音点单</h3>
    </div>
    <div class="service-card">
      <div class="icon">🎨</div>
      <h3>定制服务</h3>
    </div>
  </div>

  <div class="back-btn">
    <a href="index.html">← 返回首页</a>
  </div>
</div>

<div class="tabbar">
  <div class="tab-item" onclick="location.href='index.html'">
    <span class="icon">🏠</span>
    首页
  </div>
  <div class="tab-item active">
    <span class="icon">▦</span>
    分类
  </div>
  <div class="tab-item">
    <span class="icon">👤</span>
    关于我们
  </div>
</div>
</body>
</html>
